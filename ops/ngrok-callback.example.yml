# Preparation only. NOT an activation approval or a runnable merchant configuration.
# Replace the reserved example domain only after a separate controlled setup approval.
# Authtoken belongs in a private local config, never in this file or a command log.
version: 3
agent:
  web_addr: false
  inspect_db_size: -1
  log: false
  console_ui: false
  remote_management: false
  update_check: false
endpoints:
