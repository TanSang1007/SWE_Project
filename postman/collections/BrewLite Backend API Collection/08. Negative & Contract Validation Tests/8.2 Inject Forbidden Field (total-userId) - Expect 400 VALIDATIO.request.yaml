  Authorization: Bearer {{customerToken}}
  Idempotency-Key: bad-{{$guid}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "items": [
        {
          "productId": "{{cappuccinoId}}",
          "size": "S",
          "qty": 1,
          "toppingIds": []
        }
      ],
      "total": "0"
    }
order: 2000
