$kind: http-request
name: 5.2 Get Operator Order Detail (GET /operator/orders/:id) -> Auto saves orderVersion
url: "{{baseUrl}}/operator/orders/{{orderId}}"
method: GET
headers:
  Authorization: Bearer {{staffToken}}
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (typeof json.version === 'number') {
          pm.environment.set('orderVersion', String(json.version));
      }
    language: text/javascript
order: 2000
