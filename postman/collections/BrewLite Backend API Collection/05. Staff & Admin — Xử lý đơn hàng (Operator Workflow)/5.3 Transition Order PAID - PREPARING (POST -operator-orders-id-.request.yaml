$kind: http-request
name: 5.3 Transition Order PAID -> PREPARING (POST /operator/orders/:id/transitions)
url: "{{baseUrl}}/operator/orders/{{orderId}}/transitions"
method: POST
headers:
  Authorization: Bearer {{staffToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "expectedVersion": {{orderVersion}},
      "targetStatus": "PREPARING"
    }
order: 3000
