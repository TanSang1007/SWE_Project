$kind: http-request
name: 2.4 Login Admin (POST /auth/login) -> Auto saves adminToken
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{frontendOrigin}}"
  X-Brewlite-Csrf: "1"
body:
  type: text
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login Admin 200', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      if (json.accessToken) {
          pm.environment.set('adminToken', json.accessToken);
      }
    language: text/javascript
order: 4000
