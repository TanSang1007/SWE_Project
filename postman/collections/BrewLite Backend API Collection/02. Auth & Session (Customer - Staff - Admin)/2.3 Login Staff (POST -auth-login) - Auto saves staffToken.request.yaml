$kind: http-request
name: 2.3 Login Staff (POST /auth/login) -> Auto saves staffToken
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{frontendOrigin}}"
  X-Brewlite-Csrf: "1"
body:
  type: text
  content: |-
    {
      "email": "{{staffEmail}}",
      "password": "{{staffPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login Staff 200', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      if (json.accessToken) {
          pm.environment.set('staffToken', json.accessToken);
      }
    language: text/javascript
order: 3000
