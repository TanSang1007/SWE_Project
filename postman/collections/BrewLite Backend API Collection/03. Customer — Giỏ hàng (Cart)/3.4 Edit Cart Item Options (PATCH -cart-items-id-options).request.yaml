$kind: http-request
name: 3.4 Edit Cart Item Options (PATCH /cart/items/:id/options)
url: "{{baseUrl}}/cart/items/{{cartItemId}}/options"
method: PATCH
headers:
  Authorization: Bearer {{customerToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "size": "L",
      "toppingIds": ["{{caramelToppingId}}"]
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.items && json.items.length > 0) {
          pm.environment.set('cartItemId', json.items[0].id);
      }
    language: text/javascript
order: 4000
