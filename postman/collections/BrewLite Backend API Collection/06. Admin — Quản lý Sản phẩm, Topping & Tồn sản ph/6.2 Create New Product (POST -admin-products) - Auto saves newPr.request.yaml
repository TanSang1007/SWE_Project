$kind: http-request
name: 6.2 Create New Product (POST /admin/products) -> Auto saves newProductId
url: "{{baseUrl}}/admin/products"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Cold Brew Cam Sả",
      "price": "50000",
      "imageUrl": "/images/cappuccino.jpg",
      "sizes": [
        { "size": "S", "extraPrice": "0" },
        { "size": "M", "extraPrice": "5000" },
        { "size": "L", "extraPrice": "10000" }
      ],
      "toppingIds": [
        "{{kemToppingId}}",
        "{{caramelToppingId}}"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.id) {
          pm.environment.set('newProductId', json.id);
          pm.environment.set('newProductVersion', String(json.version ?? 0));
      }
    language: text/javascript
order: 2000
