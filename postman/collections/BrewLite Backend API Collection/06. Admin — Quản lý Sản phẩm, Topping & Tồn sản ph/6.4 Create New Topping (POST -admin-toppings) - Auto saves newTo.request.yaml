$kind: http-request
name: 6.4 Create New Topping (POST /admin/toppings) -> Auto saves newToppingId
url: "{{baseUrl}}/admin/toppings"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Trân châu trắng",
      "price": "6000"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.id) {
          pm.environment.set('newToppingId', json.id);
          pm.environment.set('newToppingVersion', String(json.version ?? 0));
      }
    language: text/javascript
order: 4000
