$kind: http-request
name: 6.6 Attach Topping to Product (POST /admin/products/:id/toppings)
url: "{{baseUrl}}/admin/products/{{latteId}}/toppings"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: Bearer {{adminToken}}
body:
  type: text
  content: |-
    {
      "toppingId": "{{caramelToppingId}}",
      "expectedVersion": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Attach Topping 201 & < 500ms', function () {
          pm.response.to.have.status(201);
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 6000
