$kind: http-request
name: 4.14 Pay Order via Mock Payment (POST /payments)
url: "{{baseUrl}}/payments"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: Bearer {{customerToken}}
  - key: Idempotency-Key
    value: "{{$guid}}"
body:
  type: text
  content: |-
    {
      "orderId": "{{orderId}}",
      "method": "WALLET"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Pay Order 200 & < 500ms', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 14000
