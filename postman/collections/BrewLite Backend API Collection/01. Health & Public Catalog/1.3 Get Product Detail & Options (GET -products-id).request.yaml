$kind: http-request
name: 1.3 Get Product Detail & Options (GET /products/:id)
url: "{{baseUrl}}/products/{{cappuccinoId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      if (json.toppings && json.toppings.length > 0) {
          pm.environment.set('kemToppingId', json.toppings[0].id);
      }
    language: text/javascript
order: 3000
