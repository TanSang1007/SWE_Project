$kind: http-request
name: 7.5 Confirm Receipt (POST /ingredient-inventory/receipts/:id/confirm)
url: "{{baseUrl}}/ingredient-inventory/receipts/{{receiptId}}/confirm"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "expectedVersion": {{receiptVersion}}
    }
order: 5000
