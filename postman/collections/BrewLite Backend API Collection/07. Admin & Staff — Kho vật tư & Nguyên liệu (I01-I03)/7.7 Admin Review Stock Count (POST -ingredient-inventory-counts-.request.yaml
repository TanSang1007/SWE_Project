$kind: http-request
name: 7.7 Admin Review Stock Count (POST /ingredient-inventory/counts/:id/review)
url: "{{baseUrl}}/ingredient-inventory/counts/{{countId}}/review"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "expectedVersion": {{countVersion}},
      "action": "APPROVE",
      "note": "Đã đối chiếu và duyệt kiểm kê"
    }
order: 7000
