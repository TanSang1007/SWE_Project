$kind: http-request
name: 7.3 List Ingredients (GET /ingredient-inventory/ingredients) -> Auto saves ingredientId
url: "{{baseUrl}}/ingredient-inventory/ingredients"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.items && json.items.length > 0) {
          pm.environment.set('ingredientId', json.items[0].id);
          pm.environment.set('ingredientVersion', String(json.items[0].version ?? 0));
      }
    language: text/javascript
order: 3000
