$kind: http-request
name: 7.6 Staff Submit Stock Count (POST /ingredient-inventory/counts) -> Auto saves countId
url: "{{baseUrl}}/ingredient-inventory/counts"
method: POST
headers:
  Authorization: Bearer {{staffToken}}
  Idempotency-Key: count-{{$guid}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "note": "Kiểm kê cuối ca chiều",
      "lines": [
        {
          "ingredientId": "{{ingredientId}}",
          "expectedVersion": {{ingredientVersion}},
          "actualQuantity": "24",
          "note": "Hao hụt 1 đơn vị"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.id) {
          pm.environment.set('countId', json.id);
          pm.environment.set('countVersion', String(json.version ?? 0));
      }
    language: text/javascript
order: 6000
