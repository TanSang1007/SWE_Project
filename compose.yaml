name: brewlite

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3001"
      FRONTEND_ORIGIN: http://localhost:3000
      PAYMENT_PROVIDER_MODE: VNPAY_SANDBOX
      VNPAY_SANDBOX_ENABLED: "true"
      VNPAY_DEPLOY_SANDBOX: "false"
      VNPAY_RESULT_URL: http://localhost:3000/payments/vnpay/result
      VNPAY_ACCEPT_NEW_PAYMENTS: "true"
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
        API_INTERNAL_BASE_URL: http://backend:3001
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      API_INTERNAL_BASE_URL: http://backend:3001
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy