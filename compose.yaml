name: brewlite
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: brewlite_dev
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in docker/local.env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U brewlite -d brewlite_dev']
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      target: backend
    init: true
    environment:
      NODE_ENV: development
      BREWLITE_CONTAINER_SANDBOX: 'true'
      PORT: '3001'
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://brewlite:${DOCKER_DB_PASSWORD}@db:5432/brewlite_dev
      DIRECT_URL: postgresql://brewlite:${DOCKER_DB_PASSWORD}@db:5432/brewlite_dev
      JWT_SECRET: ${DOCKER_JWT_SECRET:?Set DOCKER_JWT_SECRET}
      JWT_EXPIRES_IN: '3600'
      PAYMENT_PROVIDER_MODE: VNPAY_SANDBOX
      VNPAY_SANDBOX_ENABLED: 'true'
      VNPAY_ACCEPT_NEW_PAYMENTS: ${DOCKER_ACCEPT_PAYMENTS:-false}
      VNPAY_ENV: SANDBOX
      VNPAY_VERSION: 2.1.0
      VNPAY_TMN_CODE: ${DOCKER_VNPAY_TMN_CODE:?Set DOCKER_VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${DOCKER_VNPAY_HASH_SECRET:?Set DOCKER_VNPAY_HASH_SECRET}
      VNPAY_PAYMENT_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      VNPAY_IPN_URL: ${DOCKER_CALLBACK_ORIGIN:?Set DOCKER_CALLBACK_ORIGIN}/payments/vnpay/ipn
      VNPAY_RETURN_URL: ${DOCKER_CALLBACK_ORIGIN}/payments/vnpay/return
      VNPAY_RESULT_URL: http://localhost:3000/payments/vnpay/result
    ports:
      - 127.0.0.1:3002:3001
      - 127.0.0.1:3102:3102
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 20s
  frontend:
    build:
      context: .
      target: frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3002
    init: true
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
volumes:
  postgres_data:
