name: BrewLite CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Kiểm tra và build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brewlite_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/brewlite_ci
      JWT_SECRET: brewlite-ci-only-secret-at-least-32-characters
      PAYMENT_PROVIDER_MODE: VNPAY_SANDBOX
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      API_INTERNAL_BASE_URL: http://localhost:3001
      FRONTEND_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm tra Prisma
        run: npm run db:validate

      - name: Sinh Prisma Client
        run: npm run db:generate

      - name: Kiểm tra quy tắc code
        run: npm run lint

      - name: Kiểm tra TypeScript frontend
        run: npm run typecheck --workspace frontend

      - name: Kiểm thử backend
        run: npm run test --workspace backend
        env:
          NODE_ENV: test

      - name: Kiểm thử frontend
        run: npm run test --workspace frontend
        env:
          NODE_ENV: test

      - name: Build frontend và backend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Kiểm thử runtime
        run: npm run test:runtime
        env:
          NODE_ENV: test